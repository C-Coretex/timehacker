version: "1.1"

services:
  #Frontend
  vite-app:
    container_name: timehacker.ui
    build:
      context: ./TimeHacker.UI/
      target: development-dependencies-env
    ports:
      - "5173:5173"
    volumes:
      - ./TimeHacker.UI:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    command: sh -c "npm install && npm run dev -- --host"
    stdin_open: true
    tty: true

  #Backend
  timehacker.api:
    image: ${DOCKER_REGISTRY-}timehackerapi
    container_name: timehacker.api
    build:
      context: .
      dockerfile: TimeHacker.Api/Dockerfile
    ports:
      - "8080:8080"
      - "8081:8081"
    depends_on:
      timehacker.infrastructure:
        condition: service_healthy
      timehacker.infrastructure.identity:
        condition: service_healthy
      alloy:
        condition: service_started
    environment:
      - AppSettings__uiUrl=http://localhost:5173
      - DataProtection__KeysPath=/keys
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://alloy:4317
      - OTEL_EXPORTER_OTLP_PROTOCOL=grpc
      - OTEL_SERVICE_NAME=TimeHacker.Api
      - ConnectionStrings__TimeHackerConnectionString=${ConnectionStrings__TimeHackerConnectionString:-Host=timehacker.infrastructure;Database=TimeHacker;Port=5432;Username=application_user;Password=application_password;Include Error Detail=true}
      - ConnectionStrings__TimeHackerAdminConnectionString=${ConnectionStrings__TimeHackerAdminConnectionString:-Host=timehacker.infrastructure;Database=TimeHacker;Port=5432;Username=postgres;Password=postgres;Include Error Detail=true}
      - ConnectionStrings__IdentityConnectionString=${ConnectionStrings__IdentityConnectionString:-Host=timehacker.infrastructure.identity;Database=TimeHackerIdentity;Port=5432;Username=postgres;Password=postgres;Include Error Detail=true}
    volumes:
      - dataprotection-keys:/keys

  #Databases
  timehacker.infrastructure:
    image: postgres:latest
    container_name: timehacker.infrastructure
    environment:
      - POSTGRES_DB=TimeHacker
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - APP_USER_PASSWORD=${APP_USER_PASSWORD:-application_password}
    volumes:
      - timehacker-db:/var/lib/postgresql
      - ./postgres/timehacker_infrastructure_init.sql:/docker-entrypoint-initdb.d/timehacker_infrastructure_init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  timehacker.infrastructure.identity:
    image: postgres:latest
    container_name: timehacker.infrastructure.identity
    environment:
      - POSTGRES_DB=TimeHackerIdentity
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${IDENTITY_POSTGRES_PASSWORD:-postgres}
    volumes:
      - timehacker-identity-db:/var/lib/postgresql
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  #pgAdmin
  pgadmin:
    image: dpage/pgadmin4:latest
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@admin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_LISTEN_PORT: 8001
    ports:
      - "8001:8001"
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - timehacker.infrastructure
      - timehacker.infrastructure.identity

  #Observability (Grafana LGTM stack). Receives OTLP and fans out to Loki/Tempo/Prometheus.
  # Live pipeline UI at http://localhost:12345/graph.
  alloy:
    image: grafana/alloy:latest
    container_name: timehacker.alloy
    # Alloy loads and merges every *.alloy file in the config directory, so the pipeline is split
    # per signal (receiver.alloy / logs.alloy / metrics.alloy / traces.alloy).
    command:
      - "run"
      - "--server.http.listen-addr=0.0.0.0:12345"
      - "/etc/alloy"
    volumes:
      - ./observability/alloy:/etc/alloy:ro
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "12345:12345" # Alloy UI
    depends_on:
      - loki
      - tempo
      - prometheus

  loki:
    image: grafana/loki:latest
    container_name: timehacker.loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:latest
    container_name: timehacker.tempo
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./observability/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/var/tempo
    ports:
      - "3200:3200" # Tempo query/API

  prometheus:
    image: prom/prometheus:latest
    container_name: timehacker.prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"   # Alloy (app metrics) + Tempo (span/service-graph metrics) remote-write here
      - "--enable-feature=exemplar-storage"    # store exemplars (metric -> trace); Alloy sends them with send_exemplars
      - "--storage.tsdb.path=/prometheus"
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: timehacker.grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - loki
      - tempo
      - prometheus

volumes:
  timehacker-db:
  timehacker-identity-db:
  pgadmin-data:
  dataprotection-keys:
  loki-data:
  tempo-data:
  prometheus-data:
  grafana-data: